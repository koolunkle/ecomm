spring.application.name=ecomm

# 메시지 다국어 설정
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# 데이터베이스 연결 설정
spring.datasource.name=ecomm
spring.datasource.url=jdbc:h2:mem:ecomm;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# R2DBC 연결 설정 (JPA/Flyway가 사용하는 것과 동일한 임베디드 H2 인스턴스를 공유)
spring.r2dbc.url=r2dbc:h2:mem:///ecomm?options=DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;DATABASE_TO_UPPER=false
spring.r2dbc.username=sa
spring.r2dbc.password=

# JPA 및 하이버네이트 설정
spring.jpa.properties.hibernate.default_schema=ecomm
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway 데이터베이스 마이그레이션 설정
spring.flyway.schemas=ecomm

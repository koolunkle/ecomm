plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.16.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

def generatedOpenApiDir = layout.buildDirectory.dir("generated/openapi")

openApiGenerate {
    generatorName = 'spring'
    inputSpec = file("${rootDir}/src/main/resources/api/openapi.yaml").toString()
    outputDir = generatedOpenApiDir.get().asFile.toString()
    configFile = file("${rootDir}/src/main/resources/api/config.json").toString()
    ignoreFileOverride = file("${rootDir}/src/main/resources/api/.openapi-generator-ignore").toString()
    typeMappings = ['URI': 'URI']
    importMappings = ['URI': 'java.net.URI']
    // openapi-generator-cli's --components equivalent: generate only models/apis + ApiUtil.java support file
    globalProperties = [
        models: '',
        apis: '',
        supportingFiles: 'ApiUtil.java'
    ]
}

processResources {
  dependsOn(tasks.openApiGenerate)
}

compileJava.dependsOn tasks.openApiGenerate
sourceSets.main.java.srcDir "${generatedOpenApiDir.get()}/src/main/java"
sourceSets.main.resources.srcDir "${generatedOpenApiDir.get()}/src/main/resources"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	 // OpenAPI Starts
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.25'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.openapitools:jackson-databind-nullable:0.2.3'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	implementation 'org.springframework.boot:spring-boot-starter-hateoas'
	 // required for schema in swagger generated code
    implementation 'io.springfox:springfox-oas:3.0.0'
    // OpenAPI Ends

	 // Lombok Starts
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // Lombok Ends

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-hateoas-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
